                  - paragraph [ref=f7e327]: The rhythm is steady, strong, carrying the acoustic weight of a body that has never been afraid of anything because it has never needed to be. The vibration enters my palm and travels up my arm and into my chest, where it meets my own racing, shaking, eleven-minute-old heartbeat and—
                  - paragraph [ref=f7e328]:
                    - emphasis [ref=f7e329]: thm... THM... thm... THM... thm... THM...
                  - paragraph [ref=f7e330]:
                    - text: "The two rhythms drift. Closer. Closer. The intervals narrow:"
                    - emphasis [ref=f7e331]: thm-THM... thm-THM... thm-THM
