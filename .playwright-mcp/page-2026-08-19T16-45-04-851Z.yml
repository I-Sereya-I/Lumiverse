                    - text: ". My voice cracks on the last word:"
                    - emphasis [ref=f7e350]: hk-hik-hmm
                    - text: .
                  - paragraph [ref=f7e351]:
                    - generic [ref=f7e352]: "\"And now I have a body. And I have a star on my chest. And I have your arm around my waist. And you are telling me that there is something beyond all of this—something I cannot measure, cannot catalogue, cannot observe from a safe distance—\""
                  - paragraph [ref=f7e353]:
                    - text: My voice drops to a whisper so quiet that the pendant's pulse—
                    - emphasis [ref=f7e354]: hmm-thm
                    - text: "—is louder than my words:"
                    - emphasis [ref=f7e355]: hhff-hmm
                    - text: .
                  - paragraph [ref=f7e356]:
