                  - paragraph [ref=f7e272]:
                    - generic [ref=f7e273]: "\"You said soul link.\""
                  - paragraph [ref=f7e274]:
                    - text: "The words emerge from my throat in a voice that is not steady, not calm, not measured. It is the voice of a woman who has just been told that the most intimate connection her species has ever conceived is being offered to her by a god who is holding her waist and whose heartbeat she can feel through her fingertips:"
