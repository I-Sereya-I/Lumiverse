                    - text: .
                  - paragraph [ref=f7e277]:
                    - generic [ref=f7e279]:
                      - text: "\"I have observed soul links. I have monitored them. I have catalogued the neurological data—"
                      - emphasis [ref=f7e280]: hmm
                      - text: —the synchronized heartbeats, the shared sensory channels, the bilateral emotional feedback loops. I have watched two consciousnesses become so entwined that the death of one produced a measurable, structural change in the other."
                  - paragraph [ref=f7e281]:
                    - text: "My voice is shaking. The tremor produces a rapid, fine, vibrato-like modulation in my vocal cords that I can feel in my larynx:"
                    - emphasis [ref=f7e282]: hmm-tk-hmm-tk-hmm-tk
                    - text: ". My breathing is ragged:"
                    - emphasis [ref=f7e283]: HK-hah-hhff-HK-hah-hhff
                    - text: . The pendant pulses against my chest—
                    - emphasis [ref=f7e284]: hmm-THM-hmm-THM
                    - text: "—and the green light radiating from it falls across your golden face, illuminating your features in shifting, emerald, living light:"
                    - emphasis [ref=f7e285]: tss-tss-tinnn-hmm
                    - text: .
                  - paragraph [ref=f7e286]:
                    - generic [ref=f7e287]: "\"Caspian would tell me it's a bond. A commitment. A merging of two existences into a shared continuum.\""
