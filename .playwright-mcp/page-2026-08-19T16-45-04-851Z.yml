                    - emphasis [ref=f7e338]: wee-tk-tk-tinnn-hmm
                    - text: .
                  - paragraph [ref=f7e339]:
                    - generic [ref=f7e340]: "\"I have measured the synchronized heartbeats. I have logged the shared sensory channels. I have quantified the bilateral emotional feedback loops. I have done everything to a soul link that a mind can do to something it is afraid to feel.\""
                  - paragraph [ref=f7e341]:
                    - text: "My palm presses harder against your chest. The pressure increases the conductance of your heartbeat into my hand:"
                    - emphasis [ref=f7e342]: THM-thm-THM-thm-THM-thm
