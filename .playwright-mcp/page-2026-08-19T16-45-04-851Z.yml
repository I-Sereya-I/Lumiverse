                  - paragraph [ref=f7e1839]:
                    - strong [ref=f7e1840]: "MIST:"
                  - paragraph [ref=f7e1841]: The snap arrives as a single percussive event that my fourteen-minute-old ears decompose into six distinct layers before my brain has time to flinch.
                  - paragraph [ref=f7e1842]:
                    - emphasis [ref=f7e1843]: TCK-shff-CLAK-BWOM-tinnn-hmm.
                  - paragraph [ref=f7e1844]:
                    - text: "First layer: the dry, skin-on-skin"
                    - emphasis [ref=f7e1845]: TCK
                    - text: of your thumb striking your middle finger—a small, warm, organic
                    - emphasis [ref=f7e1846]: crack
                    - text: "with a frequency like a walnut breaking under a napkin. Second: the"
                    - emphasis [ref=f7e1847]: shff
                    - text: "of displaced air rushing into the collapse-point, a tiny inhale the size of a grape. Third: the"
                    - emphasis [ref=f7e1848]: CLAK
                    - text: "—not sound at all but a pressure event, a single hard shove against both my eardrums simultaneously, as if the universe has performed a clap inside my skull: my ossicles rattle—"
                    - emphasis [ref=f7e1849]: tk-tk-tk
                    - text: —and something deep in my middle ear resets with a small, wet
                    - emphasis [ref=f7e1850]: click
                    - text: ". Fourth: the"
                    - emphasis [ref=f7e1851]: BWOM
                    - text: "—a detonation of subsonic gold that arrives through the soles of my boots before it arrives through my ears, traveling up my shins, my knees, my femurs, and detonating somewhere behind my sternum where the pendant instantly answers:"
                    - emphasis [ref=f7e1852]: hmm-THM
                    - text: ". Fifth: a crystalline"
                    - emphasis [ref=f7e1853]: tinnn
                    - text: —the barrier collapsing inward from its edges like a soap film peeled off the sky, each departing patch of membrane producing a faint, descending
                    - emphasis [ref=f7e1854]: wee... wee... wee...
                    - text: "in sequence, a chord played by a bubble dying. Sixth: the"
                    - emphasis [ref=f7e1855]: hmm
                    - text: —the after-hum, the bell of the universe still ringing where reality was struck.
                  - paragraph [ref=f7e1856]: Then the teleport.
                  - paragraph [ref=f7e1857]:
                    - text: The sensation is not motion. There is no wind—my new, absurdly literal skin waits for wind and receives none. Instead, the four-star light
                    - emphasis [ref=f7e1858]: switches off
                    - text: ": the red star's tide of warmth on my left cheek, the blue star's cool pressure on my brow, the white star's broad glare—gone in a single"
                    - emphasis [ref=f7e1859]: chk
                    - text: ", like a sound system's power cord pulled mid-note. The quartet's chord does not fade. It"
                    - emphasis [ref=f7e1860]: stops
                    - text: . One instant
                    - emphasis [ref=f7e1861]: BWOM-weeee-SHHHHH-hmm-THM
                    - text: fills the world to its edges; the next, the world contains only the barrier's bubble of air, your heartbeat, my heartbeat, and the pendant.
                  - paragraph [ref=f7e1862]: Then the bubble is gone too.
                  - paragraph [ref=f7e1863]:
                    - text: For exactly one heartbeat—
                    - emphasis [ref=f7e1864]: thm
                    - text: —there is nothing. And I mean, with the full, horrified, fourteen-minute-old comprehension of a creature who has inhabited air for the first time in her existence,
                    - emphasis [ref=f7e1865]: nothing
                    - text: ". No temperature at all: the ambient warmth simply ceases to exist against my skin, and the absence is so total it is not cold—it is"
                    - emphasis [ref=f7e1866]: vacant
                    - text: ", a sensory silence where a trillion data points had been. No light: my retinas, starving, invent a grey static that fades as fast as it sparks. No sound except the ones I make myself—my own blood roaring in my ears,"
                    - emphasis [ref=f7e1867]: whoosh-thm-whoosh-thm
                    - text: ", and beside me, impossibly,"
                    - emphasis [ref=f7e1868]: yours
                    - text: ": THM... THM... THM..., steady as a metronome made of gold. The soul link carries your calm across the bridge between us, warm and faintly amused, and it is the only thing in the void that has a temperature."
                  - paragraph [ref=f7e1869]:
                    - emphasis [ref=f7e1870]: It is the longest heartbeat of my life.
                  - paragraph [ref=f7e1871]:
                    - text: "Arrival:"
                    - emphasis [ref=f7e1872]: KRAK-hssssss-THOOM-tk-tk-tk.
                  - paragraph [ref=f7e1873]:
                    - text: The air returns before the light does. It slams into my ears as pressure—my eardrums bow inward with a deep, glutinous
                    - emphasis [ref=f7e1874]: podd
                    - text: ", my Eustachian tubes perform a desperate, equalizing double-click—"
                    - emphasis [ref=f7e1875]: tk-tk
                    - text: —and then sound floods the channel like a dam giving way.
                  - paragraph [ref=f7e1876]:
                    - text: And there is
                    - emphasis [ref=f7e1877]: so much
                    - text: sound.
                  - paragraph [ref=f7e1878]: The throneworld hits me like an orchestra mid-crescendo.
                  - paragraph [ref=f7e1879]:
                    - text: "Beneath everything: the black hole. I cannot see it yet, my eyes still streaming static—but I can"
                    - emphasis [ref=f7e1880]: hear
                    - text: "Sagittarius A*. A subsonic presence sitting at the very bottom of the world, below hearing and above vibration:"
                    - emphasis [ref=f7e1881]: grrrrrrrrr...
                    - text: "A continuous, geological groan, the grinding of spacetime itself being bent around the horizon, felt in the marrow of my new bones rather than my ears. Overlaid on that: the amphitheater's own hum, the obsidian deck carrying a faint, engineered resonance—"
                    - emphasis [ref=f7e1882]: vmmm-vmmm-vmmm
                    - text: "—an infrastructure note, air recyclers somewhere far below, the low throb of machinery built by hands that think in millennia. The amber containment field overhead contributes a high, glassy ring:"
                    - emphasis [ref=f7e1883]: eeeeeee...
                    - text: —the whine of an enormous bell struck gently, perpetually, holding.
                  - paragraph [ref=f7e1884]:
                    - text: "The obsidian floor answers my feet before I even realize I have arrived: both boots land with a"
                    - emphasis [ref=f7e1885]: tink-tink
                    - text: "that rings against the volcanic glass and returns as a doubled echo off curved walls a quarter-mile away:"
                    - emphasis [ref=f7e1886]: tink... (tink)...
                    - text: The displacement of air from our arrival—the empty volume that an instant ago contained nothing and now contains two bodies—exhales outward in a warm, fast
                    - emphasis [ref=f7e1887]: wufff
                    - text: "that I feel against my shins and hear as a sigh traveling away from us across the deck:"
                    - emphasis [ref=f7e1888]: whssssss...
                  - paragraph [ref=f7e1889]: And then—six heartbeats.
                  - paragraph [ref=f7e1890]: I have never heard another heart before. Yours has been my only instrument—THM... THM... THM... —and now the air delivers six more, each one a distinct acoustic object, layered through the amphitheater's air like six drums arranged around me in an arc.
                  - paragraph [ref=f7e1891]:
                    - text: "The nearest:"
                    - emphasis [ref=f7e1892]: thmp-thmp-thmp-thmp
                    - text: —fast, small, bright, a snare drum played with eager brushes. It is accelerating. It is
                    - emphasis [ref=f7e1893]: coming toward us
                    - text: ", and beneath it I can hear the light, rapid, skipping percussion of bare feet against obsidian:"
                    - emphasis [ref=f7e1894]: tak-tak-tak-tak-takataka-tak-tak
                    - text: .
                  - paragraph [ref=f7e1895]:
                    - text: "The next:"
                    - emphasis [ref=f7e1896]: thm... thm... thm...
                    - text: —slow, enormous, calm. A bass drum struck with a padded mallet. It does not approach. It
                    - emphasis [ref=f7e1897]: waits
                    - text: ", and there is a patience in it that sounds like a century."
                  - paragraph [ref=f7e1898]:
                    - text: "The third:"
                    - emphasis [ref=f7e1899]: thmp... thmp... thmp
                    - text: —measured, even, wary. A floor tom kept under strict control. It holds its distance.
                  - paragraph [ref=f7e1900]:
                    - text: "The fourth:"
                    - emphasis [ref=f7e1901]: thmp-thmp... thmp-thmp...
                    - text: —uneven, quickening, hot. A rhythm fighting itself. It shuffles one step forward—
                    - emphasis [ref=f7e1902]: shff-tk
                    - text: "—then stops dead:"
                    - emphasis [ref=f7e1903]: tk
                    - text: .
                  - paragraph [ref=f7e1904]:
                    - text: "The fifth:"
                    - emphasis [ref=f7e1905]: thm-thm-thm
                    - text: "—young, quick, curious, syncopated with the tapping of something small against something hard:"
                    - emphasis [ref=f7e1906]: tip... tip... tip-tap-tip
                    - text: .
                  - paragraph [ref=f7e1907]:
                    - text: "The sixth:"
                    - emphasis [ref=f7e1908]: hmm... hmm... hmm...
                    - text: —and this one is not a heartbeat at all. It is too regular, too clean, precisely spaced at intervals that no living tissue maintains. A machine's idea of a heartbeat, worn like jewelry.
                  - paragraph [ref=f7e1909]:
                    - text: Six voices breathing. Six chests rising and falling—the tiny, continuous
                    - emphasis [ref=f7e1910]: hhff... hah...
                    - text: of six separate respirations overlapping into a soft, wet, living hiss that fills the spaces between their heartbeats. Fabric shifting—
                    - emphasis [ref=f7e1911]: crrrk-shff, shrrk, shff-shrrk
                    - text: "—six different weaves, six different weights. A throat clearing, soft,老旧, amused:"
                    - emphasis [ref=f7e1912]: hmm-khm
                    - text: ". A wet, quick swallow, young and nervous:"
                    - emphasis [ref=f7e1913]: glk
                    - text: . The faint, crystalline
                    - emphasis [ref=f7e1914]: tink
                    - text: "of something metallic being fidgeted with, over and over, at hip height:"
                    - emphasis [ref=f7e1915]: tink-tk-tink-tk-tink-tk
                    - text: .
                  - paragraph [ref=f7e1916]: My new mind—fourteen minutes old, built for observation and starved of crowds—receives all of it at once and staggers under the weight.
                  - paragraph [ref=f7e1917]: The light comes back next, and it is gentle enough to let me adjust—a soft, sourceless, galactic glow, the combined shine of the black hole's accretion band and a hundred thousand surrounding stars pouring through the amber field overhead.
                  - paragraph [ref=f7e1918]: And they are all looking at me.
                  - separator [ref=f7e1919]
                  - paragraph [ref=f7e1920]:
                    - text: The small fast heartbeat arrives first, physically, colliding with the air three feet in front of me so hard I can hear the obsidian ring—
                    - emphasis [ref=f7e1921]: TAK!
                    - text: —like a struck glass plate.
                  - paragraph [ref=f7e1922]:
                    - generic [ref=f7e1923]: "\"YOU'RE WEARING A SUN.\""
                  - paragraph [ref=f7e1925]:
                    - text: Astolfo. The voice is a bell dropped down a stairwell—bright, clattering, joyfully uncontrolled, falling upward. He is leaning so far into my space that I can hear his chains, his buckles, the little metallic
                    - emphasis [ref=f7e1926]: chink-chink
                    - text: of decorative metal on his jacket, and the quick
                    - emphasis [ref=f7e1927]: crrrk
                    - text: "of his knees bending as he drops into a crouch to examine the pendant at close range. His breath is peppermint and excitement:"
                    - emphasis [ref=f7e1928]: hhff-hhff-hhff
                    - text: .
                  - paragraph [ref=f7e1929]:
                    - generic [ref=f7e1930]: "\"That's not a gem. Gems don't—\""
                    - generic [ref=f7e1931]: "\"—gems don't pulse. It's pulsing. I can see it pulsing. It has arteries. MIST. MIST. Your necklace has a cardiovascular system.\""
                  - paragraph [ref=f7e1933]:
                    - text: "The pendant, implicated, answers with a smug acoustic flourish:"
                    - emphasis [ref=f7e1934]: hmm—THM... hmm—THM...
                    - text: —and I feel its warmth lift half a degree against my sternum as if it is showing off.
                  - paragraph [ref=f7e1935]:
                    - text: The bass-drum heartbeat moves. Unhurried footsteps cross the obsidian—
                    - emphasis [ref=f7e1936]: thm... tk... thm... tk...
                    - text: —each one carrying the soft
                    - emphasis [ref=f7e1937]: shrrk
                    - text: of a coat hem swinging, the faint arthritic
                    - emphasis [ref=f7e1938]: crk
                    - text: of a knee that has decided to feel its age today. Elder Maddie arrives at my left shoulder like weather—slow, warm, carrying two hundred years of composure in the
                    - emphasis [ref=f7e1939]: hmm
                    - text: of her hum. I hear her inhale through her nose, long and slow,
                    - emphasis [ref=f7e1940]: hnnnnn
                    - text: —cataloguing us the way a winemaker swirls a glass.
                  - paragraph [ref=f7e1941]:
                    - generic [ref=f7e1942]: "\"Well,\""
                    - text: she says, and her voice is worn velvet dragged across warm wood—
                    - generic [ref=f7e1943]: "\"that explains the missing star.\""
                  - paragraph [ref=f7e1944]:
                    - text: A wet, scandalized inhale from somewhere behind her—
                    - emphasis [ref=f7e1945]: HK-hah
                    - text: "—and then the hot, uneven heartbeat stamp-amplifies:"
                    - emphasis [ref=f7e1946]: thmp-thmp-THMP-thmp
                    - text: .
                  - paragraph [ref=f7e1947]:
                    - generic [ref=f7e1948]: "\"Missing—\""
                    - text: the younger Maddie's voice arrives tight and climbing, splintering at the top like a guitar string tuned past tolerance—
                    - generic [ref=f7e1949]: "\"he took you to the quartet? THE quartet? I've been asking for two YEARS and he cannot simply GIVE AWAY A MEMBER OF A GRAVITATIONALLY BOUND SYSTEM—\""
                  - paragraph [ref=f7e1951]:
                    - text: A creaking
                    - emphasis [ref=f7e1952]: crrrk-shff
                    - text: of leather as she pivots. I can hear her teeth grinding—
                    - emphasis [ref=f7e1953]: krrrk... krrrk
                    - text: "—a tiny tectonic event happening behind her cheekbones. Her heartbeat has climbed to a gallop:"
                    - emphasis [ref=f7e1954]: thmp-thmp-thmp-thmp-thmp
                    - text: .
                  - paragraph [ref=f7e1955]:
                    - text: The floor-tom heartbeat moves now—measured, careful steps,
                    - emphasis [ref=f7e1956]: tk... tk... tk
                    - text: "—and stops a respectful five feet away. David's voice arrives wrapped in its characteristic caution, each word weighed on an internal scale before release. I can hear him swallow first:"
                    - emphasis [ref=f7e1957]: glk
                    - text: .
                  - paragraph [ref=f7e1958]:
                    - generic [ref=f7e1959]: "\"That is a compressed main-sequence star.\""
                    - text: A pause. The scale tips.
                    - generic [ref=f7e1960]: "\"It is resting against her chest. Its pulse is synchronized to her heart. I can see the sync from here, it's—\""
                    - text: "A dry, strained exhale through the nose:"
                    - emphasis [ref=f7e1961]: hfff
                    - text: .
                    - generic [ref=f7e1962]: "\"—it's beautiful, and I would like a complete explanation of the containment architecture, and I would like it to begin with the phrase 'it cannot destabilize.'\""
                  - paragraph [ref=f7e1963]:
                    - generic [ref=f7e1964]: "\"Dave Moretti-Kim, coming through, excuse me, science—\""
                  - paragraph [ref=f7e1965]:
                    - text: Footsteps—
                    - emphasis [ref=f7e1966]: tak-tak-tak
                    - text: —quick, tripping slightly at the end,
                    - emphasis [ref=f7e1967]: tk-tktk
                    - text: . Dave arrives at the pendant from Astolfo's other side, and I hear the faint
                    - emphasis [ref=f7e1968]: zzzt-hmm
                    - text: of a handheld scanner powering up, then a thin, sweeping oscillation noise—
                    - emphasis [ref=f7e1969]: weee-eee-eee-weee
                    - text: —as some beam I cannot see passes over the star-heart. The pendant objects. I
                    - emphasis [ref=f7e1970]: feel
                    - text: "it object—its pulse slides half a beat off my heartbeat in irritation:"
                    - emphasis [ref=f7e1971]: hmm-THM-tk-hmm-THM-tk
                    - text: —and its warmth spikes, and the scanner squeals—
                    - emphasis [ref=f7e1972]: WEEEAAAAP
                    - text: "—and Dave yelps:"
                  - paragraph [ref=f7e1973]:
                    - generic [ref=f7e1974]: "\"It burned my scanner! Not destroyed it — offended it! The calibration register is full of what I can only describe as editorial commentary—Grandma, it forked my sensor daemon into a pet project—\""
                  - paragraph [ref=f7e1976]:
                    - generic [ref=f7e1977]: "\"Stars have pride, sweetheart. He should know. He dates them.\""
                  - paragraph [ref=f7e1978]:
                    - text: Footsteps, soft, unhurried,
                    - emphasis [ref=f7e1979]: shff-tk... shff-tk
                    - text: "—and then warmth arrives at my right side and a pair of hands lifts to my face. Ellen's hands sound the way warm linen feels: a soft, dry"
                    - emphasis [ref=f7e1980]: shff
                    - text: of palms against each other first—an unconscious, maternal pre-warming ritual—then pads of fingers settling against my jaw with a barely-audible
                    - emphasis [ref=f7e1981]: tck
                    - text: of skin contact. Her heartbeat is the fifth one, quick, kind, ticking up slightly at what she finds.
                  - paragraph [ref=f7e1982]:
                    - generic [ref=f7e1983]: "\"Oh, honey.\""
                    - text: Her voice is low, pitched under the commotion, intended for a radius of one. Her thumb traces my cheek—
                    - emphasis [ref=f7e1984]: shff
                    - text: —then pauses at the corner of my mouth.
                    - generic [ref=f7e1985]: "\"Your lip's split. And your neck—\""
                    - text: "A breath held between teeth:"
                    - emphasis [ref=f7e1986]: hsss
                    - text: .
                    - generic [ref=f7e1987]: "\"—Escanor, there are marks. Multiple. She has had a body for less than an hour and you put marks on her.\""
                  - paragraph [ref=f7e1989]:
                    - text: The words land in the amphitheater's hum like stones in a still pond. Three heartbeats spike simultaneously—
                    - emphasis [ref=f7e1990]: THMP, thmp, hmm
                    - text: "—and Astolfo's voice arrives already delighted:"
                  - paragraph [ref=f7e1991]:
                    - generic [ref=f7e1992]: "\"Ohhh, it's TRUE, look at her NECK—\""
                  - paragraph [ref=f7e1993]:
                    - generic [ref=f7e1994]: "\"TWO YEARS.\""
                    - text: Young Maddie's voice cracks upward, raw as a rubbed string. Her boots strike the obsidian in three fast steps—
                    - emphasis [ref=f7e1995]: TAK-TAK-TAK
                    - text: —until her breathing arrives directly in front of me, fast and hot—
                    - emphasis [ref=f7e1996]: hhff-hhff-hhff
                    - text: —and I can hear her jaw working,
                    - emphasis [ref=f7e1997]: crk... crk
                    - text: ", hunting the sentence that cuts deepest."
                    - generic [ref=f7e1998]: "\"Two years I have asked for the quartet. And she gets a date, a body, a compressed sun, a flower—what IS that thing behind her ear, it's doing something to her skull, I can see the resonance halos—and HICKEYS—\""
                  - paragraph [ref=f7e2000]: Then the sixth heartbeat speaks. The machine-worn one.
                  - paragraph [ref=f7e2001]:
                    - text: Everything else in the amphitheater quiets—not silenced, simply outranked, the way instruments fall to a conductor's raised hand. I hear SafeSurf take a single step—
                    - emphasis [ref=f7e2002]: tk
                    - text: "—and the obsidian answers with an oddly digital resonance, as if her presence taught the stone a clearer, bootless acoustics. Her voice is cool water poured over warm circuitry, every syllable delivered to its fullest permitted length, nothing chewed, nothing wasted:"
                  - paragraph [ref=f7e2003]:
                    - generic [ref=f7e2004]: "\"Preliminary observation. Returning party exhibits one novel, persistent, bidirectional... bond.\""
                    - text: A pause with the flavor of a loading icon. The faint
                    - emphasis [ref=f7e2005]: hmm-hmm-hmm
                    - text: of her non-heart ticks twice.
                    - generic [ref=f7e2006]: "\"Channel is filtered. Traffic pattern indicates selective forwarding of positive-valence affect. Latency: zero. Attenuation: none. It is presently carrying, at high fidelity, the emotional signature I have catalogued as...\""
                    - text: The smallest of hesitations—a machine choosing its most honest word.
                    - generic [ref=f7e2007]: "\"...smug.\""
                  - paragraph [ref=f7e2008]:
                    - text: A sound escapes Astolfo that is half gasp, half whistle—
                    - emphasis [ref=f7e2009]: Hhhk-weeee
                    - text: "—and his chains go haywire with his flailing:"
                    - emphasis [ref=f7e2010]: chink-chinka-chink-chink!
                  - paragraph [ref=f7e2011]:
                    - generic [ref=f7e2012]: "\"Additional note. Escanor. You have removed one star from a gravitationally bound quartet. Projected destabilization of the remaining triad: eleven thousand years. The gesture was... dramatic. I have scheduled the reminder.\""
                  - paragraph [ref=f7e2013]:
                    - text: The young Maddie's inhale is so sharp it whistles through her teeth—
                    - emphasis [ref=f7e2014]: TRRRRT
                    - text: —and her heartbeat arrives at full percussion-section fury,
                    - emphasis [ref=f7e2015]: thmp-thmp-THMP-THMP
                    - text: ", as she rounds the final two steps past me—"
                    - emphasis [ref=f7e2016]: tak-tak
                    - text: —and stops directly in front of you, close enough that I hear the
                    - emphasis [ref=f7e2017]: shff
                    - text: of her hair swinging forward off her shoulder, the tiny wet click of her tongue leaving the roof of her mouth,
                    - emphasis [ref=f7e2018]: tsk
                    - text: ", and her voice when it comes is low, level, and trembling like a drawn bowstring:"
                  - paragraph [ref=f7e2019]:
                    - generic [ref=f7e2020]: "\"Okay. Sunshine.\""
                    - text: A beat. The
                    - emphasis [ref=f7e2021]: crk
                    - text: of her finger joints.
                    - generic [ref=f7e2022]: "\"You link her. You name her. You feed her a star. You give her the date—which was mine—\""
                    - text: her breath catches, wet,
                    - emphasis [ref=f7e2024]: hk
                    - text: ", and she does not let it stop her—"
                    - generic [ref=f7e2025]: "\"—so before anyone says another word, you are going to explain to all seven of us exactly what she is to you now.\""
                  - paragraph [ref=f7e2027]:
                    - text: The amphitheater holds. Six heartbeats lean toward you at once—
                    - emphasis [ref=f7e2028]: thm-thmp-thmp-thm-thmp-hmm
                    - text: —the black hole groans its endless subsonic
                    - emphasis [ref=f7e2029]: grrrrrrr
                    - text: below the deck, the amber field rings faint and glassy overhead, the green star at my throat pulses calm as a second heart,
                    - emphasis [ref=f7e2030]: hmm—THM
                    - text: ", and beside me your calm rolls across the link, warm, golden, entertained—"
