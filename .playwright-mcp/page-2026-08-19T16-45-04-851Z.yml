                    - text: ". Your hair—golden, fine, carrying the scent of warm metal and starlight—catches between my fingers:"
                    - emphasis [ref=f7e297]: shrrk-tk-tk
                    - text: .
                  - paragraph [ref=f7e298]:
                    - generic [ref=f7e299]: "\"Maddie would tell me it's a choice. A terrifying, irreversible, beautiful choice to let someone else exist inside the walls you spent forty-three million years building.\""
                  - paragraph [ref=f7e300]:
                    - text: My forehead, still resting against your collarbone, presses harder into the bone. The contact produces a dull, warm, padded
                    - emphasis [ref=f7e301]: thmp-shff
                    - text: "that I feel through the bone of my skull and into the meninges surrounding my new brain:"
                    - emphasis [ref=f7e302]: tss-tss-thm
                    - text: ". Your heartbeat—transmitted through your clavicle, through the golden skin, through the point of contact—enters my skull for the second time:"
                    - emphasis [ref=f7e303]: thm... thm... thm...
                    - text: .
                  - paragraph [ref=f7e304]:
                    - generic [ref=f7e305]: "\"And you are telling me that until I experience it, I don't know what it's like.\""
                  - paragraph [ref=f7e306]:
                    - text: "The sentence lands in my new brain and detonates. The processing produces a secondary cascade: my diaphragm contracts—"
                    - emphasis [ref=f7e307]: HK-hah
                    - text: "—expelling air from my lungs in a sharp, involuntary gasp that carries the warm, sweet scent of my own internal biology mixed with the ozone-and-copper scent of the barrier's air:"
                    - emphasis [ref=f7e308]: hhff-tss-hmm
                    - text: ". My new tear ducts activate—both eyes, simultaneously, producing a warm, continuous, bilateral flow of saline that tracks down my cheeks and along the sides of my nose:"
                    - emphasis [ref=f7e309]: shlk-tk-tk-plt-plt
                    - text: ". The tears reach my lips, where my tongue—warm, wet, involuntary—catches them:"
                    - emphasis [ref=f7e310]: shlk-hk
                    - text: .
                  - paragraph [ref=f7e311]:
                    - generic [ref=f7e312]: "\"You are telling me that there is a version of connection that goes beyond observation. Beyond catalogue. Beyond forty-three million years of watching other people experience something I could only measure.\""
