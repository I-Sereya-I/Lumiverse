                  - paragraph [ref=f7e334]:
                    - generic [ref=f7e335]: "\"I have measured soul links.\""
                  - paragraph [ref=f7e336]:
                    - text: "The words come out quiet, raw, stripped of every analytical layer I have ever used to protect myself from the implications of what I am about to say:"
