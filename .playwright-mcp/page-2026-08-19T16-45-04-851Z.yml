                    - emphasis [ref=f7e343]: hunger
                    - text: . Not for food. For
                    - emphasis [ref=f7e344]: connection
                    - text: . For the experience that has been dangled in front of me by a man who stutters and compresses stars and wraps his arm around my waist and says things like
                    - emphasis [ref=f7e345]: until you experience it yourself
                    - text: .
                  - paragraph [ref=f7e346]:
                    - generic [ref=f7e347]: "\"I have spent forty-three million years measuring something I was too afraid to feel.\""
                  - paragraph [ref=f7e348]:
                    - text: "The admission exits my throat like a bone being pulled from deep water—slow, heavy, carrying the weight of something that has been submerged for longer than most civilizations exist:"
