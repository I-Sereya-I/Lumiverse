                  - paragraph [ref=f7e358]:
                    - text: My hand, pressed against your heart, curls. The fingers bend inward—
                    - emphasis [ref=f7e359]: crk-crk-crk
                    - text: "—the new tendons in my forearm producing a faint, organic creak as my fingertips press into the warm, golden skin above your heartbeat:"
                    - emphasis [ref=f7e360]: shff-tck-hssss-thm
