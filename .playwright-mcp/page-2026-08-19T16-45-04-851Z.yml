                    - text: "—against the warm, golden skin:"
                    - emphasis [ref=f7e290]: tss-tss-tss
                    - text: ". The contact produces a tiny, warm, friction-heat that I can feel building between my thumb and your nape:"
                    - emphasis [ref=f7e291]: hssss-thm
                    - text: .
                  - paragraph [ref=f7e292]:
                    - generic [ref=f7e293]: "\"David would tell me it's a promise. A contract. A father's warning wrapped in a handshake.\""
                  - paragraph [ref=f7e294]:
                    - text: My fingers, curled around the back of your neck, tighten—the tendons in my forearm producing a faint, organic
                    - emphasis [ref=f7e295]: crk-crk-shff
